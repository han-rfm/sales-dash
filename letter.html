<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>우리 지점에 편지 남기기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--sf:#f7f8fa;--sf2:#eef0f4;
  --bd:#dde1e8;--accent:#4361ee;
  --text:#1a1a1a;--muted:#6b7280;--danger:#e0294b;--good:#0f9d67;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
input,select,textarea{font-size:16px !important;}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 80px;}
.header{text-align:center;margin-bottom:24px;}
.header h1{font-size:18px;margin-bottom:6px;}
.header p{font-size:13px;color:var(--muted);}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.4;}
textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px;color:var(--text);outline:none;font-family:'Gamja Flower',cursive;font-size:19px;line-height:1.6;min-height:200px;resize:vertical;}
textarea:focus{border-color:var(--accent);}
.submit-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.submit-btn:disabled{opacity:0.5;}
.empty-state,.done-state{text-align:center;padding:60px 20px;color:var(--muted);}
.done-state h2{color:var(--text);font-size:18px;margin-bottom:8px;}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:16px;}
#loading{text-align:center;padding:60px 20px;color:var(--muted);}
.charcount{font-size:11px;color:var(--muted);text-align:right;margin-top:4px;}
</style>
</head>
<body>

<div class="wrap">
  <div id="loading">불러오는 중...</div>
  <div id="content" style="display:none;">
    <div class="header">
      <h1>💌 우리 지점에 편지 남기기</h1>
      <p id="greeting"></p>
    </div>

    <div class="card">
      <div class="field">
        <label>편지 내용</label>
        <textarea id="msg-text" maxlength="500" placeholder="우리 지점에 하고 싶은 말을 자유롭게 남겨주세요. (감사 인사, 응원, 바라는 점 등 무엇이든 좋아요)" oninput="updateCharCount()"></textarea>
        <div class="charcount" id="char-count">0 / 500</div>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitLetter()">편지 보내기</button>
    <div class="err" id="err-msg"></div>
  </div>
  <div id="done" class="done-state" style="display:none;">
    <h2>💌 편지가 전달됐어요</h2>
    <p>소중한 마음 감사합니다.</p>
  </div>
  <div id="already-submitted" class="done-state" style="display:none;">
    <h2>💌 이미 편지를 남기셨어요</h2>
    <p>소중한 마음 이미 잘 받았어요. 감사합니다.</p>
  </div>
  <div id="not-found" class="empty-state" style="display:none;">
    <p>유효하지 않은 링크예요. 담당자에게 다시 문의해주세요.</p>
  </div>
</div>

<script>
var FB_URL = 'https://cleaning-498705-default-rtdb.asia-southeast1.firebasedatabase.app';
var ROOT = '/salesData';

function getParam(name){
  var params = new URLSearchParams(location.search);
  return params.get(name);
}
var empId = getParam('id');
var personName = '', personHq = '', personBranch = '';

function init(){
  if(!empId){ showNotFound(); return; }
  var isTest = empId === 'test';
  Promise.all([
    isTest ? Promise.resolve({name:'테스트', hq:'테스트본부', branch:'테스트지점'}) : fetch(FB_URL+ROOT+'/people/'+empId+'.json').then(function(r){return r.json();}),
    isTest ? Promise.resolve(null) : fetch(FB_URL+ROOT+'/rollingLetters/'+empId+'.json').then(function(r){return r.json();})
  ]).then(function(res){
    var person = res[0];
    var existing = res[1];
    if(!person){ showNotFound(); return; }
    personName = person.name || '';
    personHq = person.hq || '';
    personBranch = person.branch || '';
    if(!isTest && existing){
      document.getElementById('loading').style.display='none';
      document.getElementById('already-submitted').style.display='block';
      return;
    }
    var greetingText = personName + '님, ' + (personHq||'') + ' ' + (personBranch||'') + ' 소속이시네요. 우리 지점에 편지를 남겨주세요.'
      + (isTest ? ' (🧪 테스트 링크예요 — 제출해도 실제 명단에는 반영되지 않아요)' : '');
    document.getElementById('greeting').textContent = greetingText;
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }).catch(function(e){ console.error(e); showNotFound(); });
}
function updateCharCount(){
  var v = document.getElementById('msg-text').value;
  document.getElementById('char-count').textContent = v.length + ' / 500';
}
function showNotFound(){
  document.getElementById('loading').style.display='none';
  document.getElementById('not-found').style.display='block';
}
function submitLetter(){
  var btn = document.getElementById('submit-btn');
  var errEl = document.getElementById('err-msg');
  errEl.textContent = '';
  var msg = document.getElementById('msg-text').value.trim();
  if(!msg){ errEl.textContent = '편지 내용을 입력해주세요.'; return; }
  btn.disabled = true;
  btn.textContent = '보내는 중...';
  var entry = {
    empId: empId, name: personName, hq: personHq, branch: personBranch,
    message: msg, submittedAt: new Date().toISOString()
  };
  fetch(FB_URL+ROOT+'/rollingLetters/'+empId+'.json', {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(entry)
  }).then(function(r){
    if(!r.ok) throw new Error('저장 실패');
    document.getElementById('content').style.display='none';
    document.getElementById('done').style.display='block';
  }).catch(function(e){
    errEl.textContent = '전송 중 오류가 발생했어요. 다시 시도해주세요.';
    btn.disabled = false;
    btn.textContent = '편지 보내기';
  });
}
init();
</script>
</body>
</html>
